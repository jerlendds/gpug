[package]
name = "gpug-data"
version = "0.1.0"
edition = "2021"
publish = false
description = "Columnar graph data and analytics for GPUG"
license = "MIT"

[features]
default = []
vortex = [] # Compatibility alias: Vortex is now required.
benchmark-backends = []
duckdb = ["dep:duckdb"]
duckdb-bundled = ["duckdb", "duckdb/bundled"]

[dependencies]
vortex = { version = "=0.86.1", default-features = false, features = ["files", "tokio", "zstd"] }
duckdb = { version = "=1.10505.0", default-features = false, optional = true }


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
