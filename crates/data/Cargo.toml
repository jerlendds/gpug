[package]
name = "gpug-data"
version = "0.1.0"
edition = "2021"
publish = false
description = "Columnar graph data and analytics for GPUG"
license = "MIT"

[features]
default = []
vortex = ["dep:vortex"]
duckdb = ["dep:duckdb"]
duckdb-bundled = ["duckdb", "duckdb/bundled"]
gpug = ["dep:gpug", "dep:gpui"]

[dependencies]
vortex = { version = "=0.86.1", default-features = false, features = ["files", "tokio", "zstd"], optional = true }
duckdb = { version = "=1.10505.0", default-features = false, optional = true }
gpug = { path = "../gpug", optional = true }
gpui = { workspace = true, optional = true }

[[example]]
name = "data_flow"
required-features = ["gpug"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[[example]]
name = "aggregate_graph"
required-features = ["gpug"]

[[example]]
name = "bridge_benchmark"
required-features = ["gpug"]
